<!DOCTYPE html>
<html lang="en-CA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canadian Mortality Table</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <nav class="nav">
        <a href="index.html" class="nav-link active" data-i18n="nav.table">Mortality table</a>
        <a href="withdrawal.html" class="nav-link" data-i18n="nav.withdrawal">Withdrawal rate</a>
        <button type="button" id="langToggle" class="lang-toggle">Français</button>
    </nav>
    <h1 data-i18n="i.title">Canadian Mortality Table</h1>
    <p class="lead" data-i18n="i.lead"></p>

    <form id="controls" onsubmit="return false">
        <label><span data-i18n="geo"></span>
            <select id="geo"></select>
        </label>
        <label><span data-i18n="sex"></span>
            <select id="sex">
                <option value="female" data-i18n="female">Female</option>
                <option value="male" data-i18n="male">Male</option>
            </select>
        </label>
        <label><span data-i18n="age"></span>
            <input id="age" type="number" min="0" max="100" step="1" value="0">
        </label>
    </form>
    <p class="privacy" data-i18n="privacy.sel"></p>
    <p id="note" class="note" hidden></p>

    <div id="summary" class="summary"></div>

    <h2 data-i18n="i.h1"></h2>
    <div id="chartSurvival" class="chart"></div>
    <h2 data-i18n="i.h2"></h2>
    <div id="chartQ" class="chart"></div>

    <h2 data-i18n="i.h3"></h2>
    <div class="table-wrap">
        <table id="mortalityTable">
            <thead>
                <tr>
                    <th data-i18n="i.th1"></th>
                    <th data-i18n="i.th2"></th>
                    <th data-i18n="i.th3"></th>
                    <th data-i18n="i.th4"></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="sources">
        <h3 data-i18n="src.h"></h3>
        <p data-i18n-html="i.src1"></p>
        <p data-i18n-html="i.src2"></p>
        <p data-i18n-html="i.src3"></p>
        <p data-i18n-html="font"></p>
    </div>
</div>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="i18n.js"></script>
<script src="script.js"></script>
</body>
</html>
