<!DOCTYPE html>
<html lang="en-CA">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax-Deferred Withdrawal Rate by Age</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <nav class="nav">
        <a href="index.html" class="nav-link" data-i18n="nav.table">Mortality table</a>
        <a href="withdrawal.html" class="nav-link active" data-i18n="nav.withdrawal">Withdrawal rate</a>
        <button type="button" id="langToggle" class="lang-toggle">Français</button>
    </nav>
    <h1 data-i18n="w.title">How much of my RRSP / RRIF should I withdraw this year?</h1>
    <p class="lead" data-i18n-html="w.lead"></p>

    <form id="controls" onsubmit="return false">
        <label><span data-i18n="geo"></span>
            <select id="geo"></select>
        </label>
        <label><span data-i18n="sex"></span>
            <select id="sex">
                <option value="female" data-i18n="female">Female</option>
                <option value="male" data-i18n="male">Male</option>
            </select>
        </label>
        <label><span data-i18n="age"></span>
            <input id="age" type="number" min="0" max="100" step="1" value="65">
        </label>
        <label><span data-i18n="w.ret"></span>
            <input id="ret" type="text" inputmode="decimal" autocomplete="off" value="3">
        </label>
        <label><span data-i18n="w.bal"></span>
            <input id="bal" type="text" inputmode="numeric" autocomplete="off">
        </label>
        <label><span data-i18n="w.mode"></span>
            <select id="mode">
                <option value="expected" data-i18n="w.m1"></option>
                <option value="p25" data-i18n="w.m2"></option>
                <option value="p10" data-i18n="w.m3"></option>
            </select>
        </label>
    </form>
    <p class="privacy" data-i18n="privacy.ent"></p>
    <p id="note" class="note" hidden></p>

    <div id="summary" class="summary"></div>

    <h2 data-i18n="w.h1"></h2>
    <div id="chartW" class="chart"></div>
    <div class="legend">
        <span><i style="background:var(--accent)"></i><span data-i18n="w.l1"></span></span>
        <span><i style="background:#888"></i><span data-i18n="w.l2"></span></span>
        <span><i style="background:var(--accent2)"></i><span data-i18n="w.l3"></span></span>
    </div>

    <h2 data-i18n="w.h2"></h2>
    <div class="table-wrap">
        <table id="wTable">
            <thead>
                <tr>
                    <th data-i18n="i.th1"></th>
                    <th data-i18n="w.th2"></th>
                    <th data-i18n="w.th3"></th>
                    <th data-i18n="w.th4"></th>
                    <th data-i18n="w.th5"></th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="sources">
        <h3 data-i18n="src.h"></h3>
        <p data-i18n-html="w.src1"></p>
        <p data-i18n-html="w.src2"></p>
        <p data-i18n-html="w.src3"></p>
        <p data-i18n-html="font"></p>
    </div>
</div>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="i18n.js"></script>
<script src="withdrawal.js"></script>
</body>
</html>
